version: '3.9'
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ltester
      MYSQL_USER: tester
      MYSQL_PASSWORD: tester123
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    environment:
      LT_DATABASE_URL: mysql+pymysql://tester:tester123@mysql:3306/ltester
      LT_JWT_SECRET: change_me_in_production
    ports:
      - '8000:8000'
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE: http://backend:8000/api/v1
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  mysql_data:
